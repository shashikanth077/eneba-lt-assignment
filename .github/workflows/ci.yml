name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job uses a throwaway MySQL service. Credentials here exist only inside the runner.
# APP_ENV=local + a loopback APP_URL is what lets the app run with the repository's dev-only secrets (src/Support/ConfigGuard.php).
env:
  APP_ENV: local
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_USER: root
  DB_PASS: root
  JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  KEY_ENCRYPTION_KEY: ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZC0=

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: keymart_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit --fail-on-skipped
        env:
          TEST_DB_NAME: keymart_test
      - name: The Railway import file loads into an empty MySQL 8 and refuses a second import
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE import_check CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mysql -h 127.0.0.1 -uroot -proot import_check < database/railway_import.sql
          test "$(mysql -h 127.0.0.1 -uroot -proot -N import_check -e 'select count(*) from products')" = "120"
          ! mysql -h 127.0.0.1 -uroot -proot import_check < database/railway_import.sql 2>/dev/null

  frontend:
    name: Frontend (lint, types, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, full purchase)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_NAME: keymart
      APP_DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - name: Create the schema and the demo catalogue
        run: php bin/setup.php
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  # Builds the production image and starts it like Render does (PORT from the platform, APP_ENV=production, migrate + seed on start),
  # so a broken Dockerfile, start script or production config fails here and not on the first deploy (docs/DEPLOY.md).
  image:
    name: API Docker image (build, migrate, seed, serve)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: keymart
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t keymart-api backend
      - name: Start it
        run: |
          docker run -d --name api --network host \
            -e PORT=10000 -e APP_ENV=production -e APP_DEBUG=false -e COOKIE_SECURE=true \
            -e APP_URL=https://keymart-demo.vercel.app \
            -e JWT_SECRET="$(openssl rand -hex 32)" -e KEY_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            -e DB_HOST=127.0.0.1 -e DB_PORT=3306 -e DB_NAME=keymart -e DB_USER=root -e DB_PASS=root \
            -e RUN_MIGRATIONS=true -e SEED_ON_START=if-empty \
            keymart-api
      - name: Health, catalogue and demo sign-in
        run: |
          wait_for_health() {
            for i in $(seq 1 60); do
              curl -fsS http://127.0.0.1:10000/api/health && return 0
              sleep 3
            done
            docker logs api
            return 1
          }
          wait_for_health
          curl -fsS "http://127.0.0.1:10000/api/products?pageSize=1" | jq -e '.items | length > 0'
          curl -fsS -i -X POST http://127.0.0.1:10000/api/auth/login \
            -H 'Content-Type: application/json' -H 'X-Requested-With: fetch' -H 'Origin: https://keymart-demo.vercel.app' \
            -d '{"email":"demo.buyer@keymart.test","password":"Demo-Buyer-2027"}' | tee /tmp/login.txt
          grep -i '^set-cookie: session=.*Secure' /tmp/login.txt
      - name: A restart is safe (migrations and seed are skipped)
        run: |
          docker restart api
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:10000/api/health && break; sleep 3; done
          docker logs api 2>&1 | grep -E "Nothing to migrate|seeding skipped"
