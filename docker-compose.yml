# Local development stack: PHP API (:8080), MySQL (:3307), Vite dev server (:5173).
# Works with no .env file; copy .env.example to .env to change the defaults.
services:
  php:
    build: ./backend
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:-keymart}
      DB_USER: ${MYSQL_USER:-keymart}
      DB_PASS: ${MYSQL_PASSWORD:-keymart}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_URL: http://localhost:5173
      # Dev-only secrets so the stack works out of the box. Override in .env, never reuse in production.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY:-ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZC0=}
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      # Stripe test mode: put your own keys in the root .env (see .env.example). Empty = payments answer 503.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Verification e-mails are sent by the API (docs/EMAIL.md). Empty = not sent.
      EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID:-}
      EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY:-}
      EMAILJS_AUTH_TEMPLATE_ID: ${VITE_EMAILJS_AUTH_TEMPLATE_ID:-}
      EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
      SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@keymart.example}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-keymart}
      MYSQL_USER: ${MYSQL_USER:-keymart}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-keymart}
    ports:
      - "3307:3306" # 3307 on the host so it does not clash with a local MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro # creates the keymart_test database on first start
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://php
      # Browser-side settings (public by design). Empty = Stripe checkout shows "not set up" and no emails are sent.
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      VITE_EMAILJS_SERVICE_ID: ${VITE_EMAILJS_SERVICE_ID:-}
      VITE_EMAILJS_PUBLIC_KEY: ${VITE_EMAILJS_PUBLIC_KEY:-}
      VITE_EMAILJS_AUTH_TEMPLATE_ID: ${VITE_EMAILJS_AUTH_TEMPLATE_ID:-}
      VITE_EMAILJS_ORDER_TEMPLATE_ID: ${VITE_EMAILJS_ORDER_TEMPLATE_ID:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - php

  # Optional: docker compose --profile tools up
  phpmyadmin:
    image: phpmyadmin:5
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  frontend_node_modules:
